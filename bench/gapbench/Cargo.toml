[package]
name = "gapbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "GAP-Bench end-to-end token efficiency and latency benchmark harness (L5)."

[[bin]]
name = "gapbench"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
futures-util.workspace = true
gap-core.workspace = true
gap-exec.workspace = true
gap-index.workspace = true
gap-mcp.workspace = true
gap-ngc-sdk.workspace = true
gap-plan.workspace = true
gap-proto.workspace = true
gap-ql.workspace = true
gap-route.workspace = true
gap-snapshot.workspace = true
gap-store.workspace = true
gap-transport.workspace = true
prost-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
