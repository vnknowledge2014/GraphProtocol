# GAP (Graph Agent Protocol) workspace manifest (ADR-002, ADR-019, ARC-001, ARC-003).

[workspace]
resolver = "3"
members = [
  "crates/*",
  "adapters/*",
  "bench/*",
]
exclude = [
  "fuzz",
  "bench/results",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# Intra-workspace crates (alphabetically sorted; docs/AGENT-GUIDE.md §6)
# ---------------------------------------------------------------------------
gap-a2a = { path = "adapters/gap-a2a" }
gap-balance = { path = "crates/gap-balance" }
gap-conformance = { path = "crates/gap-conformance" }
gap-core = { path = "crates/gap-core" }
gap-exec = { path = "crates/gap-exec" }
gap-index = { path = "crates/gap-index" }
gap-ingest = { path = "crates/gap-ingest" }
gap-mcp = { path = "adapters/gap-mcp" }
gap-models = { path = "crates/gap-models" }
gap-ngc-cli = { path = "adapters/gap-ngc-cli" }
gap-ngc-code = { path = "adapters/gap-ngc-code" }
gap-ngc-graphql = { path = "adapters/gap-ngc-graphql" }
gap-ngc-grpc = { path = "adapters/gap-ngc-grpc" }
gap-ngc-openapi = { path = "adapters/gap-ngc-openapi" }
gap-ngc-sdk = { path = "crates/gap-ngc-sdk" }
gap-ngc-sql = { path = "adapters/gap-ngc-sql" }
gap-plan = { path = "crates/gap-plan" }
gap-proto = { path = "crates/gap-proto" }
gap-ql = { path = "crates/gap-ql" }
gap-route = { path = "crates/gap-route" }
gap-s1 = { path = "crates/gap-s1" }
gap-sec = { path = "crates/gap-sec" }
gap-snapshot = { path = "crates/gap-snapshot" }
gap-store = { path = "crates/gap-store" }
gap-testkit = { path = "crates/gap-testkit" }
gap-transport = { path = "crates/gap-transport" }

# ---------------------------------------------------------------------------
# Third-party crate catalogue (ADR-002; docs/evidence/crate-versions.md).
#
# NOTE (WP-M0-02 offline sandbox): Every third-party pin below mirrors the
# exact pin recorded in docs/evidence/crate-versions.md and awaits online
# re-verification (`cargo add --dry-run` / `cargo update --dry-run`) by the
# reviewer. No member crate in WP-M0-02 depends on third-party crates yet so
# the workspace builds and locks completely offline.
#
# Omissions per docs/evidence/crate-versions.md & ADR-019:
# - `blake3`: marked `(verify)` without a version pin in crate-versions.md;
#   omitted pending online verification (along with unpinned crates needed by
#   later WPs — see docs/evidence/crate-versions.md and WP-M0-02 handoff).
# - `rhai`: deferred out of 1.0 (ADR-019).
# - `a2a-rs`: unused (generated from vendored official `a2a.proto` instead).
# - `cargo-nextest`, `cargo-fuzz`, `cargo-deny`: CLI subcommand binaries.
# - `libfuzzer-sys`: pinned at "0.4.13" inside standalone `fuzz/Cargo.toml`.
# ---------------------------------------------------------------------------
