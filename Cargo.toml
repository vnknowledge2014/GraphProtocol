# GAP (Graph Agent Protocol) workspace manifest (ADR-002, ADR-019, ARC-001, ARC-003).

[workspace]
resolver = "3"
members = [
  "crates/*",
  "adapters/*",
  "bench/*",
]
exclude = [
  "fuzz",
  "bench/results",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# Intra-workspace crates (alphabetically sorted; docs/AGENT-GUIDE.md §6)
# ---------------------------------------------------------------------------
# Each entry carries `version` (same as [workspace.package]) so cargo-deny does not
# treat the path dependency as a wildcard and the crates stay publishable.
gap-a2a = { path = "adapters/gap-a2a", version = "0.1.0" }
gap-balance = { path = "crates/gap-balance", version = "0.1.0" }
gap-conformance = { path = "crates/gap-conformance", version = "0.1.0" }
gap-core = { path = "crates/gap-core", version = "0.1.0" }
gap-exec = { path = "crates/gap-exec", version = "0.1.0" }
gap-index = { path = "crates/gap-index", version = "0.1.0" }
gap-ingest = { path = "crates/gap-ingest", version = "0.1.0" }
gap-mcp = { path = "adapters/gap-mcp", version = "0.1.0" }
gap-models = { path = "crates/gap-models", version = "0.1.0" }
gap-ngc-cli = { path = "adapters/gap-ngc-cli", version = "0.1.0" }
gap-ngc-code = { path = "adapters/gap-ngc-code", version = "0.1.0" }
gap-ngc-graphql = { path = "adapters/gap-ngc-graphql", version = "0.1.0" }
gap-ngc-grpc = { path = "adapters/gap-ngc-grpc", version = "0.1.0" }
gap-ngc-openapi = { path = "adapters/gap-ngc-openapi", version = "0.1.0" }
gap-ngc-sdk = { path = "crates/gap-ngc-sdk", version = "0.1.0" }
gap-ngc-sql = { path = "adapters/gap-ngc-sql", version = "0.1.0" }
gap-plan = { path = "crates/gap-plan", version = "0.1.0" }
gap-proto = { path = "crates/gap-proto", version = "0.1.0" }
gap-ql = { path = "crates/gap-ql", version = "0.1.0" }
gap-route = { path = "crates/gap-route", version = "0.1.0" }
gap-s1 = { path = "crates/gap-s1", version = "0.1.0" }
gap-sec = { path = "crates/gap-sec", version = "0.1.0" }
gap-snapshot = { path = "crates/gap-snapshot", version = "0.1.0" }
gap-server = { path = "crates/gap-server", version = "0.1.0" }
gap-store = { path = "crates/gap-store", version = "0.1.0" }
gap-testkit = { path = "crates/gap-testkit", version = "0.1.0" }
gap-transport = { path = "crates/gap-transport", version = "0.1.0" }

# ---------------------------------------------------------------------------
# Third-party crate catalogue (ADR-002; docs/evidence/crate-versions.md).
#
# NOTE (WP-M0-02): the pins below mirror docs/evidence/crate-versions.md. The
# reviewer re-verified them online on 2026-10-26: all pins plus the crates added
# at the end of this table resolve together (829 packages) with exactly one
# version each of axum, hyper, prost and tower (ADR-002). No member crate depends
# on third-party crates yet, so the workspace builds and locks completely offline.
#
# Omissions per docs/evidence/crate-versions.md & ADR-019:
# - `rhai`: deferred out of 1.0 (ADR-019).
# - `a2a-rs`: unused (generated from vendored official `a2a.proto` instead).
# - `cargo-nextest`, `cargo-fuzz`, `cargo-deny`: CLI subcommand binaries.
# - `libfuzzer-sys`: pinned at "0.4.13" inside standalone `fuzz/Cargo.toml`.
# ---------------------------------------------------------------------------
apollo-compiler = "1.33.1"
apollo-parser = "0.8.7"
arc-swap = "1.9.3"
async-graphql-parser = "7.2.1" # fallback only
axum = "0.8.9"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
cedar-policy = "4.14.0"
criterion = { version = "0.8.2", default-features = false } # members add features = ["cargo_bench_support"]
crossbeam-utils = "0.8.23"
dashmap = "6.2.1" # non-hot-path only (INV-02)
divan = "0.1.21"
ed25519-dalek = "3.0.0"
fastembed = "7.5.0"
governor = "0.10.4"
hdrhistogram = { version = "7.6.0", default-features = false }
hnsw_rs = "0.3.5"
jsonschema = "0.60.1"
jsonwebtoken = "11.1.0"
llguidance = "1.9.1"
loom = "0.7.2"
metrics = "0.24.6"
moka = { version = "0.12.16", default-features = false }
openapiv3 = "2.2.0"
opentelemetry = "0.33.1"
ort = "=2.0.0-rc.15" # pre-release exact pin, feature-gated (ADR-002)
petgraph = "0.8.3"
proptest = "1.12.0"
prost = "0.14.4"
prost-reflect = "0.16.5"
prost-types = "0.14.4"
protox = "0.10.0"
redb = "4.4.0"
rmcp = "3.7.0"
rusqlite = "0.41.0"
rustls = "0.23.46"
secrecy = "0.10.3"
sha2 = "0.11.1"
shuttle = "0.9.8"
simsimd = "6.5.16"
sqlite-vec = "0.1.9"
sqlparser = "0.63.0"
surrealdb = "3.3.4" # BSL-1.1: permitted ONLY under feature `store-surreal` (ADR-002, ADR-020)
tokenizers = "0.23.2"
tokio = "1.54"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tree-sitter = "0.27.1"
usearch = "2.26.6"
zeroize = "1.9.1"

# Added by the WP-M0-02 review (2026-10-26): crates needed by later WPs that had no
# pin in docs/evidence/crate-versions.md. Versions are the latest that resolve
# together with the pins above; features are chosen by the consuming WPs.
anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = "4.6.7"
http = "1.5.0"
hyper = "1.12.0"
im = "15.1.0"
reqwest = { version = "0.13.5", default-features = false } # no TLS backend yet: the WP that needs TLS picks one and clears the licence gate
safetensors = "0.8.0"
schemars = "1.2.3"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio-stream = "0.1.19"
toml = "1.1.8"
unicode-normalization = "0.1.26"
uuid = "1.29.0"

# Added for WP-M0-08 (2026-10-26): tracing/OpenTelemetry init helper. They resolve
# together with every pin above (tonic 0.14.6, prost 0.14.4, hyper 1.12.0 and
# tower 0.5.3 stay single-version) and were vendored and built offline.
opentelemetry-otlp = { version = "0.33.1", default-features = false }
opentelemetry_sdk = "0.33.1"
tracing-subscriber = "0.3.23"

# Added for WP-M0-09, WP-M2-01 and WP-M3-01 (2026-10-27): dev-only temp directories for the
# SQLite backup/restore tests and the conformance fixtures (already in the lockfile via proptest).
tempfile = "3.27.0"

# Added for WP-M1-03 (2026-10-29): gap-ngc-sdk transports (gRPC/HTTP/stdio), stream helpers and the in-memory test
# transport. All four are already in the lockfile through tonic/axum/hyper; features are chosen by the consuming WP.
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper-util = "0.1.21"
tokio-util = "0.7.20"

# Added for WP-M1-11 (2026-10-31): gap-ngc-openapi request building (RFC 3986 percent-encoding, URL parsing, JSON Schema `pattern`). All three are
# already in the lockfile (reqwest, proptest); no new package.
percent-encoding = "2.3.2"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] } # JSON Schema `pattern` in the argument validator
url = "2.5.8"
