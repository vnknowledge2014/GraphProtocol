# NGC connector conformance profile for `gap-ngc-openapi` (`WP-M1-11`, `NGC-091`, `CMP-030..033`).
# Paired OpenAPI 3.1 fixture: `tests/fixtures/openapi/shop.openapi.json`.
# Format reference: `conformance/ngc/README.md`.

name = "openapi-shop"

[timing]
deadline_ms = 200
grace_ms = 2000

# Keyed read (`GET /customers/{id}`) advertising `x-gap-in-param` native batching (`GET /customers?ids=...`).
[read]
operation = "customer"
key_var = "id"
keys = [1, 2, 3, 4, 5, 6]
absent_key = 999
failing_key = "not-an-id"
row_key = "id"
upstream_batch = 50

# Paginated, sortable list (`GET /customers?limit&offset&sort&region`). 12 rows, 3 per page -> 4 pages.
[page]
operation = "customers"
limit = 3
order_by = "credit_cents"
other_arguments = { region = "eu" }

# Control endpoint (`GET /slow`) that stays open until cancelled or its deadline passes (`NGC-025`).
[slow]
operation = "slow"
calls = 8

# Unadvertised mutation name used by `mutate.dry_run` to verify `Mutate(dry_run = true)` fails `UNIMPLEMENTED` (`NGC-031`).
[mutate]
operation = "create_order"

# Size-truncation probe (`GET /blobs`): 40 rows of ~1 KiB each, exceeding the test connector's 8 KiB response cap (`NGC-027`).
[size]
operation = "blobs"
expected_total_rows = 40
resumable = true

# Invalid argument probe (`id` must be an integer, `NGC-060`).
[errors.invalid_query]
operation = "customer"
arguments = { id = "not-an-integer" }
