// Client-facing gRPC wrapper over GAP-QL. The GraphQL-over-HTTP binding (spec/02 §1) is primary;
// this exists for gRPC-only environments and carries the same JSON response document.
syntax = "proto3";

package gap.gateway.v1;

import "google/protobuf/struct.proto";

service Gateway {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // Subscriptions (single root field) and @defer/@stream incremental delivery.
  rpc Subscribe(ExecuteRequest) returns (stream ExecuteResponse);
}

message ExecuteRequest {
  string query = 1;                       // GAP-QL document (or empty with persisted_query_sha256)
  string persisted_query_sha256 = 2;
  string operation_name = 3;
  google.protobuf.Struct variables = 4;
  google.protobuf.Struct extensions = 5;  // contains "gap" object per spec/02 §6
}

message ExecuteResponse {
  bytes json = 1;                         // UTF-8 JSON GraphQL response (data/errors/extensions)
  uint32 http_status_equivalent = 2;      // what the HTTP binding would have returned
}
