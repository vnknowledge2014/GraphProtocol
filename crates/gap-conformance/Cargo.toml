[package]
name = "gap-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Black-box GAP protocol conformance runner and NGC connector conformance kit (L5)."

[[bin]]
name = "gap-conformance"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
apollo-compiler.workspace = true
axum.workspace = true
blake3.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
futures-util.workspace = true
gap-core.workspace = true
gap-exec.workspace = true
gap-ngc-sdk.workspace = true
gap-plan.workspace = true
gap-proto.workspace = true
gap-ql.workspace = true
gap-snapshot.workspace = true
gap-transport.workspace = true
http-body-util.workspace = true
prost.workspace = true
prost-types.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
tonic.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
gap-ngc-openapi.workspace = true
gap-mcp.workspace = true
gap-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
