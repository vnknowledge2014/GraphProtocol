[package]
name = "gap-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP/2 GraphQL-over-HTTP, graphql-sse, gRPC, and stdio transport stack with rate limiting and load shedding (L4)."

# The dependency set of WP-M1-08 is fixed by work/context/m1-08-brief.md section 2; it was resolved offline before dispatch.
[dependencies]
axum.workspace = true
blake3.workspace = true
bytes.workspace = true
futures-util.workspace = true
gap-balance.workspace = true
gap-core.workspace = true
gap-exec.workspace = true
gap-plan.workspace = true
gap-proto.workspace = true
gap-ql.workspace = true
gap-sec.workspace = true
gap-snapshot.workspace = true
http-body-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
gap-ngc-sdk.workspace = true
gap-testkit.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower = { workspace = true, features = ["util"] }
