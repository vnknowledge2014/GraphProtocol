[package]
name = "gap-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Development-only deterministic test utilities, mocks, and workspace policy checks for GAP."

[dependencies]
gap-core.workspace = true
gap-ngc-sdk.workspace = true
gap-proto.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
