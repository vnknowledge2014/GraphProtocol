<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1B365D"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#009E73"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D55E00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="500" fill="#FFFFFF"/>

  <!-- Agent Hosts & Dual-Stack Edge -->
  <rect x="24" y="18" width="892" height="72" rx="8" fill="#F8FAFC" stroke="#1B365D" stroke-width="1.5"/>
  <text x="42" y="42" font-size="13" font-weight="700" fill="#1B365D">AI Agent Hosts &amp; Dual-Stack Transport Ingress (L4)</text>
  <text x="42" y="61" font-size="10.5" fill="#475569">MCP 2026-07-28 (651 tok)  |  GAP-QL (/graphql + SSE)  |  A2A v1.0 Tasks  |  AG-UI v1.0 (/ag-ui SSE &amp; Interrupts)  |  CLI</text>
  <text x="42" y="79" font-size="10.5" font-weight="600" fill="#0072B2">Wire Edge: HTTP/1.1 + HTTP/2 TCP (Alt-Svc)  ·  HTTP/3 QUIC UDP (RFC 9114, TLS 1.3 ALPN h3, 0-RTT disabled)  ·  gRPC  ·  stdio</text>

  <!-- Plane 1: Deterministic Execution -->
  <rect x="24" y="122" width="556" height="222" rx="8" fill="#EFF6FF" stroke="#0072B2" stroke-width="1.8"/>
  <text x="42" y="145" font-size="12.5" font-weight="700" fill="#0072B2">Plane 1: Deterministic Hot Execution Plane (Zero ML · INV-01 / INV-02 / INV-04)</text>

  <rect x="40" y="160" width="122" height="68" rx="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.2"/>
  <text x="101" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#1B365D">AuthN + Cedar</text>
  <text x="101" y="199" text-anchor="middle" font-size="9.8" fill="#475569">Default-Deny Policy</text>
  <text x="101" y="214" text-anchor="middle" font-size="9.8" fill="#475569">Scopes &amp; Cost Caps</text>

  <rect x="174" y="160" width="124" height="68" rx="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.2"/>
  <text x="236" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#1B365D">GAP-QL Planner</text>
  <text x="236" y="199" text-anchor="middle" font-size="9.8" fill="#475569">ArcSwap + AVL OrdMap</text>
  <text x="236" y="214" text-anchor="middle" font-size="9.8" fill="#475569">Tenant PlanCache</text>

  <rect x="310" y="160" width="124" height="68" rx="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.2"/>
  <text x="372" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#1B365D">Batch Executor</text>
  <text x="372" y="199" text-anchor="middle" font-size="9.8" fill="#475569">DataLoader Join O(1)</text>
  <text x="372" y="214" text-anchor="middle" font-size="9.8" fill="#475569">P2C LB + Breaker</text>

  <rect x="446" y="160" width="118" height="68" rx="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.2"/>
  <text x="505" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#1B365D">Security Guard</text>
  <text x="505" y="199" text-anchor="middle" font-size="9.8" fill="#475569">EgressGuard SSRF</text>
  <text x="505" y="214" text-anchor="middle" font-size="9.8" fill="#475569">OS Sandbox &amp; T2 Tag</text>

  <!-- Sub-box inside Plane 1 -->
  <rect x="40" y="244" width="524" height="84" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="302" y="267" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1B365D">Native Graph Connector (NGC) Adapters + Durable Multi-Tenant State</text>
  <text x="302" y="287" text-anchor="middle" font-size="10.2" fill="#475569">OpenAPI  |  GraphQL  |  gRPC  |  SQL (SQLite/PostgreSQL)  |  Sandboxed CLI  |  Code Graph (tree-sitter)</text>
  <text x="302" y="306" text-anchor="middle" font-size="10.2" fill="#009E73">ContextStore (SQLite WAL/FTS5 + opt. SurrealDB)  ·  TaskStore Leases  ·  BLAKE3 Audit Chain</text>

  <!-- Plane 2: Discovery -->
  <rect x="604" y="122" width="312" height="104" rx="8" fill="#ECFDF5" stroke="#009E73" stroke-width="1.8"/>
  <text x="620" y="145" font-size="12.5" font-weight="700" fill="#009E73">Plane 2: Calibrated Discovery</text>
  <text x="620" y="166" font-size="10.5" font-weight="600" fill="#1B365D">__metaGraph (L0) -&gt; __search (L1) -&gt; __type (L2)</text>
  <text x="620" y="185" font-size="10" fill="#475569">BM25 + HNSW Hybrid + Visibility Bitset (INV-05)</text>
  <text x="620" y="203" font-size="10" fill="#475569">Opt. S1 (Laya, Jev, Gemini Dec. 1) + Fallback (INV-17)</text>

  <!-- Plane 3: Ingestion & Snapshot Control -->
  <rect x="604" y="240" width="312" height="104" rx="8" fill="#FFF7ED" stroke="#D55E00" stroke-width="1.8"/>
  <text x="620" y="263" font-size="12.5" font-weight="700" fill="#D55E00">Plane 3: Zero-Trust Control Plane</text>
  <text x="620" y="284" font-size="10.5" font-weight="600" fill="#1B365D">Propose-Not-Activate + T0 / T1 / T2 Trust Tiers</text>
  <text x="620" y="303" font-size="10" fill="#475569">SHA-256 Desc-Hash Pin -&gt; Drift Freeze (SEC-082)</text>
  <text x="620" y="321" font-size="10" fill="#475569">Wait-Free ArcSwap Publish + Auto-Rollback</text>

  <!-- Bottom Cross-cutting Invariant strip -->
  <rect x="24" y="366" width="892" height="114" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="42" y="390" font-size="12" font-weight="700" fill="#1B365D">Core Architectural Guarantees &amp; Verified Runtime Invariants</text>
  <text x="42" y="411" font-size="10.5" fill="#475569">1. Wait-Free Snapshot Atomicity (INV-01, INV-02): Each request pins one Arc&lt;Snapshot&gt; backed by pure-Rust persistent AVL OrdMap.</text>
  <text x="42" y="430" font-size="10.5" fill="#475569">2. Multi-Tenant &amp; Supply-Chain Hygiene (INV-09, ADR-002): TenantId in all keys; zero unsafe outside S1; zero RUSTSEC advisories.</text>
  <text x="42" y="449" font-size="10.5" fill="#475569">3. Rug-Pull &amp; Replay Defense (INV-08, OPS-005): Drift freezes mutations; T2 output in &lt;gap:untrusted&gt;; HTTP/3 0-RTT disabled.</text>
  <text x="42" y="468" font-size="10.5" fill="#475569">4. Strict Layering (ARC-002): L0..L6 acyclic crate DAG ensures zero ML runtime crates reach execution, transport, or authz.</text>

  <!-- Directional Connectors -->
  <line x1="290" y1="90" x2="290" y2="119" stroke="#1B365D" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <line x1="760" y1="90" x2="760" y2="119" stroke="#009E73" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="604" y1="292" x2="583" y2="292" stroke="#D55E00" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-orange)"/>
</svg>