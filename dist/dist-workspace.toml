# cargo-dist workspace packaging configuration (`WP-M7-08`, `OPS-041`, `SEC-101`).

[workspace]
members = ["crates/gap-cli"]

[dist]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
checksum = "sha256"
install-path = "CARGO_HOME"
precise-builds = true
allow-dirty = ["ci"]
