[package]
name = "gap-ngc-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dynamic gRPC / Protobuf reflection Native Graph Connector adapter (L4)."

[dependencies]
blake3.workspace = true
bytes.workspace = true
futures-util.workspace = true
gap-core.workspace = true
gap-ngc-sdk.workspace = true
gap-proto.workspace = true
gap-sec.workspace = true
http.workspace = true
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
prost-types.workspace = true
protox.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[[test]]
name = "grpc_connector"
path = "tests/grpc_connector.rs"
