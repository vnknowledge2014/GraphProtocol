[package]
name = "gap-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Inbound 5-tool stateless MCP facade and outbound MCP branch connector for GAP (L4)."

# The dependency set of WP-M1-09 and WP-M1-10 is fixed by work/context/m1-09-brief.md section 2; it was resolved offline before dispatch.
[dependencies]
apollo-compiler.workspace = true
axum.workspace = true
blake3.workspace = true
futures-util.workspace = true
gap-core.workspace = true
gap-ngc-sdk.workspace = true
gap-proto.workspace = true
gap-ql.workspace = true
gap-sec.workspace = true
prost-types.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
gap-snapshot.workspace = true
gap-testkit.workspace = true
gap-transport.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
