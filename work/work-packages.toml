# GAP work packages (ADR-022). Validate with: python3 tools/wp.py validate
# size: S<=0.5 agent-day, M<=2, L<=5 (XL forbidden: split first). role -> omni DAG role.
# `owns`: globs this WP may modify. WPs that can run concurrently MUST have disjoint `owns` (enforced).
# Shared-file rules (docs/AGENT-GUIDE.md §6): crate Cargo.toml deps are sorted & merged by union; Cargo.lock is regenerated after merge.
# Module-stub rule: WP-M0-02 generates empty module stubs for every top-level module implied by the `owns` globs (python3 tools/wp.py modules), so no later WP edits lib.rs/main.rs.
# Acceptance commands run from the repo root; `cargo` commands imply `--locked` once Cargo.lock exists.

