# Primary CI pipeline (WP-M0-04; ADR-022, OPS-040, SEC-100)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly supply-chain and verification run (SEC-100)
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  tools-test:
    name: Python Plan & Architecture Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python tools unit tests (zero-skip enforced)
        run: |
          python3 -c "import sys, unittest; s = unittest.defaultTestLoader.discover('tools', pattern='test_*.py'); r = unittest.TextTestRunner(verbosity=2).run(s); print(f'ran={r.testsRun} skipped={len(r.skipped)}'); sys.exit(0 if (r.wasSuccessful() and len(r.skipped) == 0 and r.testsRun > 0) else 1)"
      - name: Validate work packages
        run: python3 tools/wp.py validate
      - name: Check crate layering and ARC-002
        run: python3 tools/check_layers.py
      - name: Check spec and ADR references
        run: python3 tools/check_refs.py
      - name: Check requirement-to-test traceability
        run: python3 tools/spec_trace.py --warn

  fmt-and-docs:
    name: Format & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --workspace --no-deps

  supply-chain:
    name: Supply Chain Audit (SEC-100)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Run cargo-deny
        run: cargo deny check advisories bans licenses sources
      - name: Run cargo-audit
        run: cargo audit

  build-and-test:
    name: Build, Lint & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: clippy
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux sandbox & Prometheus tools (SEC-070, G-20)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap prometheus
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          promtool check rules ops/prometheus/alerts.yml
      - name: Run clippy across workspace targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build workspace targets
        run: cargo build --workspace --all-targets
      - name: Run workspace test suite (excluding stress and release-latency gates)
        run: cargo nextest run --workspace --exclude gap-snapshot -E 'not test(e2e_typed_path_overhead_p99_under_10ms_with_zero_io_mocks)'
      - name: Run gap-snapshot composition and handle tests
        run: cargo nextest run -p gap-snapshot --lib --test compose --test handle
      - name: Run release-mode timing & swap-stress gates
        run: |
          cargo test --release -p gap-server --test e2e -- --exact e2e_typed_path_overhead_p99_under_10ms_with_zero_io_mocks
          cargo test --release -p gap-snapshot --test swap_stress
      - name: Run offline protocol conformance & graphql-js differential suite (G-1)
        run: |
          cargo run -p gap-conformance -- --class Core --offline conformance/gql
          if [ "${{ runner.os }}" = "Linux" ]; then
            npm install --no-save --no-package-lock --prefix tests/differential graphql@16.13.2
            GAP_GRAPHQL_JS_DIR="$PWD/tests/differential/node_modules/graphql" cargo test -p gap-conformance --test differential_gql -- --ignored
            rm -rf tests/differential/node_modules
          fi

  coverage:
    name: Coverage Summary (G-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain & llvm-tools
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Measure workspace library coverage
        run: cargo llvm-cov --workspace --lib --summary-only
