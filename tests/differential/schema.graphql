# Plain GraphQL schema for the differential corpus (no GAP namespacing): the same SDL is loaded by graphql-js and apollo-compiler.
directive @cost(weight: Int, listSize: Int) on FIELD_DEFINITION

interface Entity {
  id: ID!
}

type Order implements Entity {
  id: ID!
  sku: String!
  status: OrderStatus!
  totalCents: Int! @cost(weight: 2)
  note: String
  lines(first: Int): [Line!]! @cost(weight: 1, listSize: 100)
}

type Line implements Entity {
  id: ID!
  quantity: Int!
}

enum OrderStatus {
  OPEN
  PAID
  SHIPPED
}

input OrderFilter {
  status: OrderStatus
  minTotal: Int! = 0
}

union Searchable = Order | Line

type Node {
  id: ID!
  next: Node
}

type Query {
  shopVersion: String @cost(weight: 1)
  order(id: ID!): Order @cost(weight: 2)
  orders(first: Int, status: OrderStatus, filter: OrderFilter): [Order!]! @cost(weight: 2, listSize: 10)
  search(term: String!): [Searchable!]!
  entity(id: ID!): Entity
  node(id: ID!): Node
}

type Mutation {
  createOrder(sku: String!): Order! @cost(weight: 5)
}
