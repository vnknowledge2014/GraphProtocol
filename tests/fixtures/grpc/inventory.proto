syntax = "proto3";

package acme.inventory.v1;

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_AVAILABLE = 1;
  ITEM_STATUS_BACKORDERED = 2;
}

message Dimensions {
  int32 width_mm = 1;
  int32 height_mm = 2;
}

message GetItemRequest {
  string sku = 1;
  bool include_dimensions = 2;
}

message GetItemResponse {
  string sku = 1;
  string name = 2;
  int32 stock = 3;
  ItemStatus status = 4;
  Dimensions dimensions = 5;
  repeated string tags = 6;
  map<string, string> labels = 7;
}

message CheckAvailabilityRequest {
  string sku = 1;
}

message CheckAvailabilityResponse {
  string sku = 1;
  bool in_stock = 2;
}

message ReserveItemRequest {
  string sku = 1;
  int32 quantity = 2;
}

message ReserveItemResponse {
  string reservation_id = 1;
  int32 remaining_stock = 2;
}

message WatchStockRequest {
  string warehouse_id = 1;
}

message StockEvent {
  string event_id = 1;
  string sku = 2;
  int32 delta = 3;
}

service InventoryService {
  // No side effects declared -> eligible for QUERY only under T0/T1 admin policy.
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Idempotent declared -> eligible for QUERY only under T0/T1 admin policy.
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Unspecified idempotency_level -> always MUTATION with SideEffectHint::SIDE_EFFECT_UNSPECIFIED.
  rpc ReserveItem(ReserveItemRequest) returns (ReserveItemResponse);

  // Server-streaming RPC -> SUBSCRIPTION.
  rpc WatchStock(WatchStockRequest) returns (stream StockEvent);
}
